name: Nightly corpus refresh

on:
  schedule:
    - cron: '30 3 * * *'  # 3:30am UTC, offset from trump-background (3:00) and iran-archive (3:15)
  workflow_dispatch:       # Allow manual trigger from GitHub Actions UI

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install httpx requests psycopg2-binary python-dotenv

      - name: Run refresh
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          REUTERS_CLIENT_ID: ${{ secrets.REUTERS_CLIENT_ID }}
          REUTERS_CLIENT_SECRET: ${{ secrets.REUTERS_CLIENT_SECRET }}
        run: python refresh.py
